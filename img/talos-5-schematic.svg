<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" fill="none" stroke="#dfe4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Abstract five-axis schematic used by .placeholder-art until product renders exist. -->
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#dfe4ea" stroke-opacity=".3" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 1.5 8 5 2 8.5" stroke="#45b1ff" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Bed -->
  <path d="M92 476H628" stroke-opacity=".5"/>
  <rect x="100" y="477" width="520" height="11" fill="url(#hatch)" stroke="none"/>

  <!-- Uprights and A-axis drive -->
  <g fill="#0a0c10" stroke-opacity=".62">
    <rect x="118" y="290" width="62" height="186" rx="3"/>
    <rect x="540" y="290" width="62" height="186" rx="3"/>
    <rect x="602" y="310" width="32" height="48" rx="3"/>
  </g>
  <g stroke-opacity=".34">
    <circle cx="149" cy="334" r="17"/>
    <circle cx="149" cy="334" r="6"/>
    <circle cx="571" cy="334" r="17"/>
    <circle cx="571" cy="334" r="6"/>
    <path d="M118 440H180M540 440H602"/>
  </g>

  <!-- Cradle -->
  <g fill="#0a0c10" stroke-opacity=".62">
    <path d="M198 304H214V412Q214 418 220 418H500Q506 418 506 412V304H522V424Q522 434 512 434H208Q198 434 198 424Z"/>
    <rect x="180" y="323" width="18" height="22"/>
    <rect x="522" y="323" width="18" height="22"/>
  </g>

  <!-- Rotary base and platter (C axis) -->
  <path d="M288 372V392A72 24 0 0 0 432 392V372" fill="#0a0c10" stroke-opacity=".5"/>
  <g fill="#0b0d12" stroke-opacity=".74">
    <path d="M228 334V350A132 44 0 0 0 492 350V334"/>
    <ellipse cx="360" cy="334" rx="132" ry="44"/>
  </g>
  <ellipse cx="360" cy="334" rx="121" ry="40.3" stroke-opacity=".42" stroke-width="5" stroke-dasharray="1 6.6" stroke-linecap="butt"/>
  <ellipse cx="360" cy="334" rx="92" ry="30.7" stroke-opacity=".3" stroke-width="1.1" stroke-dasharray="2 5" stroke-linecap="butt"/>

  <!-- Billet -->
  <g fill="#0d1016" stroke-opacity=".82">
    <path d="M326 296V333A34 11.3 0 0 0 394 333V296"/>
    <ellipse cx="360" cy="296" rx="34" ry="11.3"/>
  </g>

  <!-- Spindle (Z axis) -->
  <path d="M334 18V58M386 18V58" stroke-opacity=".3"/>
  <g fill="#0a0c10" stroke-opacity=".74">
    <rect x="316" y="58" width="88" height="112" rx="4"/>
    <path d="M334 170V192L346 212H374L386 192V170"/>
    <rect x="349" y="212" width="22" height="15" rx="1.5"/>
    <path d="M356.5 227V287L360 294L363.5 287V227"/>
  </g>
  <path d="M316 82H404M316 146H404M334 192H386" stroke-opacity=".3"/>

  <!-- Centre lines -->
  <g stroke-opacity=".3" stroke-width="1" stroke-dasharray="16 5 2 5" stroke-linecap="butt">
    <path d="M360 8V524"/>
    <path d="M56 334H676"/>
  </g>

  <!-- Tool contact point -->
  <ellipse cx="360" cy="296" rx="11" ry="3.7" stroke="#45b1ff" stroke-opacity=".5" stroke-width="1"/>
  <circle cx="360" cy="296" r="2.6" fill="#45b1ff" stroke="none"/>

  <!-- Axes -->
  <g stroke="#45b1ff" stroke-width="1.4">
    <path d="M379.3 445.1A30 9 0 1 1 340.7 445.1" marker-end="url(#arrow)"/>
    <path d="M662.9 314.7A9 30 0 1 0 662.9 353.3" marker-end="url(#arrow)"/>
    <path d="M110 200V142" marker-end="url(#arrow)"/>
    <path d="M110 200H168" marker-end="url(#arrow)"/>
    <path d="M110 200L150 177" marker-end="url(#arrow)"/>
  </g>
  <g fill="#45b1ff" stroke="none" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <text x="110" y="131">Z</text>
    <text x="182" y="204.5">X</text>
    <text x="162" y="172">Y</text>
    <text x="406" y="456.5">C</text>
    <text x="692" y="338.5">A</text>
  </g>
</svg>
